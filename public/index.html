<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>osu-web — rhythm is just a click away</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23ed2e7e'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header id="topbar">
    <div class="logo" data-nav="menu"><span class="logo-dot"></span> osu!<span class="logo-sub">web</span></div>
    <nav id="mainnav">
      <button data-nav="menu" class="navbtn active">Menu</button>
      <button data-nav="play" class="navbtn">Play</button>
      <button data-nav="multiplayer" class="navbtn">Multiplayer</button>
      <button data-nav="editor" class="navbtn">Editor</button>
      <button data-nav="leaderboards" class="navbtn">Leaderboards</button>
      <button data-nav="profile" class="navbtn">Profile</button>
      <button data-nav="settings" class="navbtn">Settings</button>
    </nav>
    <div id="userbox">
      <span id="conn-dot" title="connection"></span>
      <span id="user-label">Guest</span>
      <button id="login-btn" class="smallbtn">Login</button>
    </div>
  </header>
  <main id="screen"></main>
  <footer id="statusbar">
    <span id="status-msg">Ready</span>
    <span id="status-right"></span>
  </footer>
</div>

<!-- Login modal -->
<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <button id="modal-close">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Chat -->
<div id="chat-panel">
  <div id="chat-header">Chat <span id="chat-toggle">–</span></div>
  <div id="chat-messages"></div>
  <div id="chat-input-row"><input id="chat-input" placeholder="Type a message… (Enter to send)"><button id="chat-send">Send</button></div>
</div>

<script src="/js/jszip.min.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/beatmap.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/builtin.js"></script>
<script src="/js/replay.js"></script>
<script src="/js/engine.js"></script>
<script src="/js/editor.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
